<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#0a0f0a"/>
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a0f"/>
      <stop offset="100%" stop-color="#0a0f0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- Wall (left side) -->
  <rect x="40" y="40" width="16" height="380" fill="#1a2e1a" rx="3"/>
  <rect x="30" y="40" width="36" height="8" fill="#10b981" rx="3"/>

  <!-- Person facing wall -->
  <!-- Head -->
  <circle cx="220" cy="130" r="28" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <!-- Face direction indicator -->
  <circle cx="210" cy="128" r="4" fill="#10b981" opacity="0.6"/>

  <!-- Torso -->
  <line x1="220" y1="158" x2="220" y2="290" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Left arm raised against wall -->
  <path d="M220 185 Q140 165 80 155" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm raised -->
  <path d="M220 185 Q290 165 350 155" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Hands -->
  <circle cx="80" cy="155" r="7" fill="#10b981"/>
  <circle cx="350" cy="155" r="7" fill="#10b981"/>

  <!-- Arrows showing upward movement -->
  <path d="M75 145 L75 120" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M345 145 L345 120" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="75,112 70,125 80,125" fill="#10b981"/>
  <polygon points="345,112 340,125 350,125" fill="#10b981"/>

  <!-- Legs -->
  <path d="M220 290 L190 400" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 290 L250 400" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <!-- Feet -->
  <path d="M190 400 L160 412" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M250 400 L280 412" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Distance dots from wall -->
  <circle cx="158" cy="285" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="160" cy="295" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="162" cy="305" r="3" fill="#10b981" opacity="0.5"/>
  <text x="145" y="325" fill="#6ee7b7" font-size="9" font-family="sans-serif">~30cm</text>

  <!-- Category badge -->
  <rect x="120" y="20" width="160" height="24" fill="#10b981" rx="12"/>
  <text x="200" y="36" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="bold">MOBILITY EXERCISE</text>

  <!-- Exercise name -->
  <text x="200" y="450" text-anchor="middle" fill="#f0fdf4" font-size="18" font-family="sans-serif" font-weight="bold">Shoulder Wall Slide</text>
  <text x="200" y="472" text-anchor="middle" fill="#6ee7b7" font-size="12" font-family="sans-serif">Shoulders &amp; Upper Back</text>

  <!-- Sets/reps info -->
  <rect x="100" y="415" width="200" height="1" fill="#1a3a1a"/>
</svg>

