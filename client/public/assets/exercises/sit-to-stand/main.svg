<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#0a0f0a"/>
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#glow3)"/>

  <!-- Category badge -->
  <rect x="100" y="20" width="200" height="24" fill="#10b981" rx="12"/>
  <text x="200" y="36" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="bold">FUNCTIONAL STRENGTH</text>

  <!-- Chair -->
  <!-- Seat -->
  <rect x="100" y="260" width="160" height="16" fill="#1a3a1a" rx="4"/>
  <!-- Chair legs -->
  <line x1="110" y1="276" x2="110" y2="350" stroke="#1a3a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="276" x2="250" y2="350" stroke="#1a3a1a" stroke-width="5" stroke-linecap="round"/>
  <!-- Chair back -->
  <rect x="100" y="185" width="12" height="80" fill="#1a3a1a" rx="3"/>
  <!-- Floor -->
  <rect x="60" y="350" width="280" height="8" fill="#1a2e1a" rx="2"/>

  <!-- Person - seated position (showing transition) -->
  <!-- Head -->
  <circle cx="220" cy="120" r="26" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Torso (slightly leaning forward) -->
  <path d="M220 146 Q215 200 210 260" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms -->
  <path d="M215 175 Q170 195 140 210" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M215 175 Q265 195 295 210" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Thighs (seated, angled forward) -->
  <path d="M210 260 Q175 262 150 275" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M210 260 Q230 262 250 275" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Shins (vertical when seated) -->
  <line x1="150" y1="275" x2="148" y2="350" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="275" x2="252" y2="350" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Feet flat on floor -->
  <path d="M148 350 L120 356" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M252 350 L280 356" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Stand up arrow -->
  <path d="M310 260 L310 160" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="310,150 304,167 316,167" fill="#10b981"/>
  <text x="320" y="215" fill="#6ee7b7" font-size="10" font-family="sans-serif" transform="rotate(90,320,215)">STAND</text>

  <!-- Sit down arrow -->
  <path d="M90" y="160 L90 260" stroke="#34d399" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Control cue -->
  <rect x="120" y="370" width="160" height="36" fill="#0f1a0f" rx="8" stroke="#1a3a1a" stroke-width="1"/>
  <text x="200" y="385" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="sans-serif">Movement Focus</text>
  <text x="200" y="400" text-anchor="middle" fill="#10b981" font-size="12" font-family="sans-serif" font-weight="bold">Slow &amp; Controlled</text>

  <!-- Exercise name -->
  <text x="200" y="445" text-anchor="middle" fill="#f0fdf4" font-size="18" font-family="sans-serif" font-weight="bold">Sit-to-Stand</text>
  <text x="200" y="467" text-anchor="middle" fill="#6ee7b7" font-size="12" font-family="sans-serif">Quadriceps, Glutes &amp; Core</text>
</svg>

