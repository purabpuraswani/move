<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#0a0f0a"/>
  <defs>
    <radialGradient id="glow4" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#glow4)"/>

  <!-- Category badge -->
  <rect x="110" y="20" width="180" height="24" fill="#10b981" rx="12"/>
  <text x="200" y="36" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="bold">STRENGTH EXERCISE</text>

  <!-- Floor/mat -->
  <rect x="40" y="310" width="320" height="10" fill="#1a2e1a" rx="3"/>
  <rect x="60" y="316" width="280" height="4" fill="#10b981" opacity="0.15" rx="2"/>
  <text x="200" y="340" text-anchor="middle" fill="#1f3a1f" font-size="10" font-family="sans-serif">exercise mat</text>

  <!-- Person lying on back - Glute Bridge (hips raised position) -->
  <!-- Head -->
  <ellipse cx="100" cy="275" rx="22" ry="24" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Upper body on floor -->
  <path d="M122 275 L220 280" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms flat on floor -->
  <path d="M150 280 L155 308" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M185 280 L190 308" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hips raised up -->
  <path d="M220 280 Q240 200 265 195 Q285 200 300 285" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Thighs (angled) -->
  <!-- Left thigh -->
  <path d="M265 195 Q255 250 250 308" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <!-- Right thigh (knees bent) -->
  <path d="M300 285 Q295 295 290 308" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Feet flat on floor -->
  <path d="M250 308 L230 312" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M290 308 L310 312" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Upward arrow for hip movement -->
  <path d="M260 220 L260 155" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="260,145 254,162 266,162" fill="#10b981"/>
  <text x="272" y="185" fill="#6ee7b7" font-size="10" font-family="sans-serif">lift hips</text>

  <!-- Muscle highlight -->
  <path d="M230 260 Q265 235 295 265" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <text x="263" y="248" text-anchor="middle" fill="#10b981" font-size="9" font-family="sans-serif">glutes</text>

  <!-- Ground arrows showing feet pressure -->
  <path d="M240 310 L240 325" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <path d="M300 310 L300 325" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>

  <!-- Hold info box -->
  <rect x="130" y="360" width="140" height="40" fill="#0f1a0f" rx="8" stroke="#1a3a1a" stroke-width="1"/>
  <text x="200" y="376" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="sans-serif">Hold at Top</text>
  <text x="200" y="393" text-anchor="middle" fill="#10b981" font-size="14" font-family="sans-serif" font-weight="bold">2–3 seconds</text>

  <!-- Exercise name -->
  <text x="200" y="440" text-anchor="middle" fill="#f0fdf4" font-size="18" font-family="sans-serif" font-weight="bold">Glute Bridge</text>
  <text x="200" y="462" text-anchor="middle" fill="#6ee7b7" font-size="12" font-family="sans-serif">Glutes, Hamstrings &amp; Lower Back</text>
</svg>

