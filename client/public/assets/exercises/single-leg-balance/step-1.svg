<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#0a0f0a"/>
  <defs>
    <radialGradient id="glow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#glow2)"/>
  <rect x="0" y="300" width="400" height="10" fill="#1a2e1a" rx="2"/>

  <!-- Chair/support on right -->
  <rect x="310" y="230" width="10" height="160" fill="#1a3a1a" rx="3"/>
  <rect x="295" y="225" width="40" height="8" fill="#10b981" rx="3"/>

  <!-- Category badge -->
  <rect x="110" y="20" width="180" height="24" fill="#10b981" rx="12"/>
  <text x="200" y="36" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="bold">BALANCE &amp; STABILITY</text>

  <!-- Person standing on one leg -->
  <!-- Head -->
  <circle cx="200" cy="115" r="28" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Torso -->
  <line x1="200" y1="143" x2="200" y2="270" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Right arm extending to support -->
  <path d="M200 175 Q270 195 310 235" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <circle cx="313" cy="237" r="6" fill="#10b981" opacity="0.8"/>
  <!-- Light touch indicator -->
  <text x="330" y="235" fill="#6ee7b7" font-size="9" font-family="sans-serif">light touch</text>

  <!-- Left arm out for balance -->
  <path d="M200 175 Q145 185 110 175" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <circle cx="108" cy="174" r="6" fill="#34d399" opacity="0.6"/>

  <!-- Standing leg (right) -->
  <line x1="200" y1="270" x2="220" y2="300" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Foot -->
  <path d="M220 300 L250 308" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Lifted leg (left) -->
  <path d="M200 270 Q175 285 175 305" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,3"/>
  <circle cx="175" cy="308" r="6" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3,2"/>
  <!-- Arrow showing lift -->
  <text x="130" y="310" fill="#6ee7b7" font-size="10" font-family="sans-serif">lifted</text>

  <!-- Balance indicator -->
  <circle cx="200" cy="115" r="40" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Ground shadow -->
  <ellipse cx="235" cy="308" rx="20" ry="5" fill="#10b981" opacity="0.15"/>

  <!-- Hold timer graphic -->
  <rect x="130" y="340" width="140" height="40" fill="#0f1a0f" rx="10" stroke="#1a3a1a" stroke-width="1"/>
  <text x="200" y="357" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="sans-serif">Hold Duration</text>
  <text x="200" y="374" text-anchor="middle" fill="#10b981" font-size="14" font-family="sans-serif" font-weight="bold">10–20 seconds</text>

  <!-- Exercise name -->
  <text x="200" y="440" text-anchor="middle" fill="#f0fdf4" font-size="16" font-family="sans-serif" font-weight="bold">Supported Single-Leg Balance</text>
  <text x="200" y="462" text-anchor="middle" fill="#6ee7b7" font-size="12" font-family="sans-serif">Legs, Ankles &amp; Core</text>
</svg>

